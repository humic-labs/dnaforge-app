name: Contributor License Agreement

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  sign-off:
    name: Every commit agrees to the CLA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          path: .ci-control
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'

      - name: Check contributor identities with the trusted workflow checker
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            node .ci-control/.github/scripts/check-queue-cla.mjs "$BASE" "$HEAD"
          else
            node .ci-control/.github/scripts/check-cla-sign-off.mjs "$BASE" "$HEAD"
          fi
