name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop build, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683         
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020     
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the desktop app
        run: pnpm --dir apps/desktop build

      - name: Typecheck the desktop app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --dir apps/desktop typecheck

      - name: Build the Rust helpers the desktop app runs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          pnpm --dir apps/desktop helpers:build

      - name: Run the desktop unit tests
        run: pnpm --dir apps/desktop test

      - name: Run the package unit tests
        if: success() || failure()
        run: pnpm -r --filter "./packages/**" run --if-present test

  sidecar:
    name: Rust helpers and Python sidecar tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683         
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065         
        with:
          python-version-file: '.python-version'

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39         
        with:
          version: '0.13.5'
          enable-cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'

      - name: Install the security-patched Python the sidecar pins
        run: node scripts/ci-setup-secure-python.mjs --version "$(cat apps/api/.python-version)" --arch "$RUNNER_ARCH"

      - name: Build the Rust helpers
        run: |
          set -euo pipefail
          cargo build --release --bin dna-indexer --bin dna-coverage
          echo "DNA_INDEXER_PATH=$PWD/target/release/dna-indexer" >> "$GITHUB_ENV"
          echo "DNA_COVERAGE_PATH=$PWD/target/release/dna-coverage" >> "$GITHUB_ENV"

      - name: Install the sidecar's dependencies
        working-directory: apps/api
        run: uv sync --frozen --extra dev --python "$VIRTUAL_ENV/bin/python"

      - name: Run the sidecar tests
        working-directory: apps/api
        run: uv run --frozen pytest -q

  run-from-source:
    name: Run the app from source on macOS
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
        with:
          version: '0.13.5'
          enable-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the security-patched Python the sidecar pins
        run: node scripts/ci-setup-secure-python.mjs --version "$(cat apps/api/.python-version)" --arch "$RUNNER_ARCH"

      - name: Install the sidecar's dependencies
        working-directory: apps/api
        run: uv sync --frozen --extra dev --python "$VIRTUAL_ENV/bin/python"

      - name: Build the Rust helpers the desktop app runs
        run: pnpm --dir apps/desktop helpers:build

      - name: Run the app from source and wait until it is up
        run: |
          set -euo pipefail
          cp apps/desktop/.env.local.example apps/desktop/.env.local
          pnpm --dir apps/desktop run check:run-from-source

      - name: Set up and start the app with the one-command script
        run: |
          set -euo pipefail
          rm apps/desktop/.env.local
          node start.mjs --yes --check

  source-development:
    name: Source development on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
        with:
          version: '0.13.5'
          enable-cache: false

      - name: Install the security-patched Python the sidecar pins
        run: node scripts/ci-setup-secure-python.mjs --version "$(cat apps/api/.python-version)" --arch "$RUNNER_ARCH"

      - name: Install Linux build and desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y musl-tools xvfb libgtk-3-0 libnss3 libasound2t64

      - name: Set up and start the app from a fresh clone on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node start.mjs --yes --check

      - name: Set up and start the app from a fresh clone on Windows
        if: runner.os == 'Windows'
        run: node start.mjs --yes --check

      - name: Run the documented focused desktop test
        run: pnpm --dir apps/desktop test -- src/shared/native-entity-reference.test.ts
