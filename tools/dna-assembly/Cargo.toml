[package]
name = "dna-assembly"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust binary for assembly-graph primer binding (replaces the segfaulting Python ProcessPool binder) and GenBank parsing (replaces biopython). Invoked by the Python sidecar via subprocess."

[[bin]]
name = "dna-assembly"
path = "src/main.rs"

[lib]
name = "dna_assembly"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
gb-io.workspace = true
