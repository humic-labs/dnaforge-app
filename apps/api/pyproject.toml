[project]
name = "molbio-api"
version = "0.1.0"
description = "FastAPI backend for Molecular Biology Suite"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.161.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",



    "ijson>=3.3.0",


    "idna==3.20",



    "httpcore==1.0.9",



    "mcp==2.3.0",
    "jsonschema>=4.26.0,<5",
    "referencing>=0.37.0,<1",
    "cryptography==48.0.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography==50.0.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",

    "edlib>=1.3.9",
    "mappy==2.31+dnaforge.49; sys_platform != 'win32'",
    "primer3-py>=2.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "dnaforge-annotation",
    "openpyxl>=3.1.5,<4",
]

[project.scripts]
dnaforge = "src.dnaforge_cli:main"
dnaforge-jobs = "src.managed_operations_cli:main"

[project.optional-dependencies]
genome = [




    "pysam>=0.24.0; sys_platform != 'win32'",
]
sidecar = [
    "nuitka>=2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "ruff>=0.7.0",
    "nuitka>=2.0",
    "pysam>=0.24.0; sys_platform != 'win32'",


    "biopython>=1.80",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
mappy = { path = "vendor/mappy" }
dnaforge-annotation = { path = "../../packages/annotation", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
]
ignore = [
    "E501",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-report=json:coverage.json -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src"]
omit = ["**/tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
